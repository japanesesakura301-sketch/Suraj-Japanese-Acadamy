<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Suraj Japanese Academy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #5c2d91; margin-bottom: 10px; }
        p { color: #555; font-size: 0.95rem; line-height: 1.4; }
        .qr-card {
            border: 2px dashed #5c2d91;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            background: #faf8ff;
        }
        .qr-card img {
            width: 100%;
            max-width: 280px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            image-rendering: -webkit-optimize-contrast; /* Clear/Sharp बनाउने CSS */
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            font-size: 0.9rem;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            background-color: #5c2d91;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #472272; }
        .note {
            font-size: 0.8rem;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>परीक्षा शुल्क भुक्तानी</h2>
    <p>तल दिइएको Khalti / eSewa QR Scan गरेर <b>रु. ५००</b> भुक्तानी गर्नुहोस् र आफ्नो विवरण भर्नुहोस्।</p>

    <!-- Khalti QR Code Box (Direct Original Image) -->
    <div class="qr-card">
        <img src="https://i.ibb.co/t6KJpQ4/image.jpg" alt="Khalti QR Code">
        <p style="margin-top: 10px; font-weight: bold; color: #5c2d91;">Suraj Japanese Academy</p>
    </div>

    <!-- Verification Form -->
    <form id="paymentForm">
        <div class="form-group">
            <label for="name">पूरा नाम (Full Name):</label>
            <input type="text" id="name" required placeholder="तपाईंको नाम लेख्नुहोस्">
        </div>
        <div class="form-group">
            <label for="email">इमेल (Email):</label>
            <input type="email" id="email" required placeholder="example@gmail.com">
        </div>
        <div class="form-group">
            <label for="phone">फोन/Khalti नम्बर:</label>
            <input type="tel" id="phone" required placeholder="98XXXXXXXX">
        </div>
        <div class="form-group">
            <label for="txId">Transaction ID / Ref ID:</label>
            <input type="text" id="txId" required placeholder="भुक्तानीपछिको Transaction ID">
        </div>

        <button type="submit">Submit Verification</button>
    </form>

    <p class="note">⚠️ विवरण पठाएपछि Admin ले रुजु गरेर परीक्षाका लागि Approval दिनेछन्।</p>
</div>

</body>
</html>
