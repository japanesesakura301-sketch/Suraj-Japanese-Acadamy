<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Test Access - Suraj Japanese Academy</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f4f6f9; padding: 20px; }
        .pay-card { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a5276; margin-bottom: 15px; font-size: 1.3rem; text-align: center; }
        .qr-sec { text-align: center; margin: 15px 0; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        .qr-sec img { width: 180px; height: 180px; border-radius: 8px; border: 1px solid #ddd; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        .btn-pay { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .back-btn { display: inline-block; margin-bottom: 15px; color: #1a5276; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="pay-card">
        <a href="index.html" class="back-btn">← Home मा फर्कनुहोस्</a>
        <h2>Paid Mock Test - Unlocking Form</h2>
        
        <div class="qr-sec">
            <p style="font-size: 0.9rem; color: #555;">eSewa / Fonepay QR scan गरी भुक्तानी गर्नुहोस्:</p>
            <div style="background: #eee; width: 180px; height: 180px; margin: 10px auto; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
                <span style="font-size: 0.8rem; color: #777;">[तपाईंको QR Image यहाँ]</span>
            </div>
            <p><strong>eSewa ID:</strong> 98XXXXXXX</p>
            <p><strong>शुल्क:</strong> NPR 500</p>
        </div>

        <form id="payment-form" onsubmit="submitPayment(event)">
            <div class="form-group">
                <label>तपाईंको पूरा नाम (Full Name)</label>
                <input type="text" id="stu-name" required placeholder="उदा: Ram Shrestha">
            </div>

            <div class="form-group">
                <label>इमेल वा मोबाइल नम्बर (Registered Contact)</label>
                <input type="text" id="stu-contact" required placeholder="उदा: 9812345678">
            </div>

            <div class="form-group">
                <label>Transaction ID / Reference Code</label>
                <input type="text" id="trx-id" required placeholder="उदा: 8X92K01L">
            </div>

            <button type="submit" class="btn-pay" id="pay-btn">Payment Details पठाउनुहोस्</button>
        </form>
    </div>

    <script>
        async function submitPayment(e) {
            e.preventDefault();
            const btn = document.getElementById('pay-btn');
            btn.innerText = "पठाउँदैछ...";
            btn.disabled = true;

            const name = document.getElementById('stu-name').value;
            const contact = document.getElementById('stu-contact').value;
            const trxId = document.getElementById('trx-id').value;

            const { data, error } = await _supabase
                .from('payments')
                .insert([{
                    package_name: 'Kaigo Paid Package 1',
                    amount: 500,
                    transaction_id: trxId,
                    payment_status: 'pending',
                    access_active: false
                }]);

            if (error) {
                alert("समस्या आयो: " + error.message);
            } else {
                alert("तपाईंको भुक्तानी विवरण प्राप्त भयो! Admin ले verification गरेपछि Paid Test unlock हुनेछ।");
                document.getElementById('payment-form').reset();
            }

            btn.innerText = "Payment Details पठाउनुहोस्";
            btn.disabled = false;
        }
    </script>
</body>
</html>
