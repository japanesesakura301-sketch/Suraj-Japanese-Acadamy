<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Suraj Japanese Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f4f7f6; color: #333; pb: 40px; }
        
        /* Mobile-First Layout */
        .admin-container { max-width: 600px; margin: 0 auto; background: #fff; min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        .header { background: #111827; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .header h1 { font-size: 16px; font-weight: 800; }
        .header h1 span { color: #16a34a; }
        .btn-logout { background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }

        /* Loader Overlay */
        #auth-loader { position: fixed; inset: 0; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #16a34a; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Stats Section */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
        .stat-card { background: white; padding: 12px; border-radius: 10px; border: 1px solid #e5e7eb; text-align: center; }
        .stat-card h3 { font-size: 20px; color: #16a34a; font-weight: 800; }
        .stat-card p { font-size: 11px; color: #6b7280; font-weight: 600; margin-top: 2px; }

        /* Tab Navigation */
        .admin-nav { display: flex; overflow-x: auto; border-bottom: 1px solid #eee; background: #fff; }
        .admin-nav button { flex: 1; min-width: 100px; padding: 12px 8px; border: none; background: none; font-size: 12px; font-weight: 700; color: #6b7280; cursor: pointer; white-space: nowrap; }
        .admin-nav button.active { color: #16a34a; border-bottom: 3px solid #16a34a; }

        /* Content Area */
        .content { padding: 15px; }
        .section-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; color: #111827; display: flex; justify-content: space-between; align-items: center; }
        
        .btn-add { background: #16a34a; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Security Check Loading Screen -->
    <div id="auth-loader">
        <div class="spinner"></div>
        <p style="margin-top: 15px; font-size: 13px; font-weight: bold; color: #555;">Admin Verification चल्दैछ...</p>
    </div>

    <div class="admin-container">
        <!-- Header -->
        <div class="header">
            <h1>Suraj Academy <span>Admin</span></h1>
            <div>
                <button onclick="handleAdminLogout()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </div>

        <!-- Dashboard Stats Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="stat-students">0</h3>
                <p>Total Students</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-questions">0</h3>
                <p>Total Questions</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-tests">0</h3>
                <p>Active Tests</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-payments" style="color: #d97706;">0</h3>
                <p>Pending Payments</p>
            </div>
        </div>

        <!-- Admin Navigation Tabs -->
        <div class="admin-nav">
            <button onclick="switchAdminTab('questions')" id="tab-questions" class="active">Questions</button>
            <button onclick="switchAdminTab('tests')" id="tab-tests">Tests</button>
            <button onclick="switchAdminTab('packages')" id="tab-packages">Packages</button>
            <button onclick="switchAdminTab('payments')" id="tab-payments">Payments</button>
            <button onclick="switchAdminTab('users')" id="tab-users">Students</button>
        </div>

        <!-- Content Panels -->
        <div class="content">
            <!-- QUESTIONS MANAGER PANEL -->
            <div id="panel-questions">
                <div class="section-title">
                    <span>📚 Question Manager</span>
                    <button class="btn-add" onclick="alert('Step 7-E मा Question Add Form बनाइनेछ!')">+ Add Question</button>
                </div>
                <div id="questions-container" style="font-size: 13px; color: #666; text-align: center; padding: 20px;">
                    डाटा लोड हुँदैछ...
                </div>
            </div>

            <!-- OTHER PANELS (PLACEHOLDERS) -->
            <div id="panel-tests" class="hidden"><p style="padding: 20px; text-align: center;">Tests Manager Panel</p></div>
            <div id="panel-packages" class="hidden"><p style="padding: 20px; text-align: center;">Packages Manager Panel</p></div>
            <div id="panel-payments" class="hidden"><p style="padding: 20px; text-align: center;">Payments Approval Panel</p></div>
            <div id="panel-users" class="hidden"><p style="padding: 20px; text-align: center;">Student Management Panel</p></div>
        </div>
    </div>

    <!-- SUPABASE INTEGRATION & SECURITY SCRIPT -->
    <script type="module">
        import { supabase } from './supabase.js';

        // 1. DATABASE SECURITY CHECK (SUPER ADMIN VERIFICATION)
        async function verifyAdminAccess() {
            try {
                const { data: { user } } = await supabase.auth.getUser();

                if (!user) {
                    alert("कृपया पहिले लगइन गर्नुहोस्!");
                    window.location.href = "login.html";
                    return;
                }

                // Check Role in Profiles Table
                const { data: profile, error } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', user.id)
                    .single();

                if (error || !profile || profile.role !== 'admin') {
                    alert("पहुँच अस्वीकृत! यो Dashboard केवल Admin को लागि हो।");
                    window.location.href = "index.html";
                    return;
                }

                // Security Verified - Remove Loader & Load Stats
                document.getElementById('auth-loader').classList.add('hidden');
                loadDashboardStats();

            } catch (err) {
                console.error(err);
                alert("Security checking error occurred.");
                window.location.href = "index.html";
            }
        }

        // 2. DASHBOARD OVERVIEW COUNTS
        async function loadDashboardStats() {
            // Count Questions
            const { count: qCount } = await supabase.from('questions').select('*', { count: 'exact', head: true });
            document.getElementById('stat-questions').innerText = qCount || 0;

            // Count Tests
            const { count: tCount } = await supabase.from('tests').select('*', { count: 'exact', head: true });
            document.getElementById('stat-tests').innerText = tCount || 0;

            // Count Students
            const { count: sCount } = await supabase.from('profiles').select('*', { count: 'exact', head: true });
            document.getElementById('stat-students').innerText = sCount || 0;

            // Count Pending Payments
            const { count: pCount } = await supabase.from('payments').select('*', { count: 'exact', head: true }).eq('status', 'pending');
            document.getElementById('stat-payments').innerText = pCount || 0;

            document.getElementById('questions-container').innerHTML = "<p>Database बाट प्रश्नहरू लोड गर्न तयार छ।</p>";
        }

        // Logout Handle
        window.handleAdminLogout = async function() {
            await supabase.auth.signOut();
            window.location.href = "login.html";
        }

        // Tab Switching
        window.switchAdminTab = function(tabName) {
            ['questions', 'tests', 'packages', 'payments', 'users'].forEach(t => {
                document.getElementById('panel-' + t).classList.add('hidden');
                document.getElementById('tab-' + t).classList.remove('active');
            });
            document.getElementById('panel-' + tabName).classList.remove('hidden');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // Initialize Check
        verifyAdminAccess();
    </script>
</body>
</html>
