<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suraj Japanese Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f4f7f6; color: #333; padding-bottom: 20px; }
        
        .app-container { max-width: 500px; margin: 0 auto; background: #fff; min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        .header { background: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .user-greeting { font-size: 18px; font-weight: 800; color: #111; }
        .user-greeting span { color: #16a34a; }
        .sub-domain { font-size: 12px; color: #888; display: block; font-weight: normal; }

        .header-icons { display: flex; gap: 12px; align-items: center; }
        .icon-btn { font-size: 20px; color: #16a34a; text-decoration: none; cursor: pointer; }
        
        /* ADMIN DIRECT BUTTON */
        .btn-admin-link { background: #111827; color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; text-decoration: none; display: flex; align-items: center; gap: 4px; }

        .nav-tabs { display: flex; border-bottom: 2px solid #eee; background: #fff; }
        .tab-btn { flex: 1; padding: 12px 0; border: none; background: none; font-size: 14px; font-weight: 700; color: #666; cursor: pointer; }
        .tab-btn.active { color: #16a34a; border-bottom: 3px solid #16a34a; }

        .content { padding: 15px; }
        .dropdown-box { margin-bottom: 20px; }
        .dropdown-box label { font-size: 13px; font-weight: bold; color: #444; display: block; margin-bottom: 6px; }
        .dropdown-box select { width: 100%; padding: 10px; border: 1.5px solid #16a34a; border-radius: 8px; font-size: 14px; font-weight: 600; color: #16a34a; outline: none; background: #fff; }

        .pkg-card { border: 1.5px solid #16a34a; border-radius: 12px; padding: 15px; margin-bottom: 15px; background: #fff; position: relative; }
        .pkg-badges { display: flex; gap: 8px; margin-bottom: 8px; }
        .badge-time { background: #16a34a; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
        .badge-tests { background: #f0f0f0; color: #555; font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }

        .pkg-title { font-size: 16px; font-weight: 800; color: #111; margin-bottom: 15px; }
        .pkg-footer { display: flex; justify-content: space-between; align-items: flex-end; }
        .old-price { font-size: 12px; color: #999; text-decoration: line-through; display: block; text-align: right; }
        .price { font-size: 20px; font-weight: 800; color: #16a34a; }
        .btn-buy { background: #16a34a; color: white; border: none; padding: 8px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div>
                <div class="user-greeting">Hi, <span id="user-display-name">Guest</span></div>
                <span class="sub-domain">surajacademy.com</span>
            </div>
            <div class="header-icons">
                <!-- Admin Dashboard link will appear here if user is admin -->
                <a href="admin.html" id="admin-badge-btn" class="btn-admin-link hidden"><i class="fa-solid fa-user-shield"></i> Admin Panel</a>
                <a href="#" class="icon-btn"><i class="fa-solid fa-headset"></i></a>
                <a href="#" class="icon-btn"><i class="fa-solid fa-share-nodes"></i></a>
                <a href="login.html" id="auth-btn" class="icon-btn"><i class="fa-solid fa-circle-user"></i></a>
            </div>
        </div>

        <!-- Tabs Navigation -->
        <div class="nav-tabs">
            <button class="tab-btn" onclick="switchTab('my-pkg')">My Packages</button>
            <button class="tab-btn active" onclick="switchTab('buy-pkg')">Buy Packages</button>
            <button class="tab-btn" onclick="switchTab('free-tests')">Free</button>
        </div>

        <!-- Content Area -->
        <div class="content">
            <div id="section-buy">
                <div class="dropdown-box">
                    <label>Choose Category Test</label>
                    <select id="category-select">
                        <option value="04 Nursing-Skill">04 Nursing-Skill</option>
                        <option value="01 JFT-Basic">01 JFT-Basic</option>
                        <option value="02 JLPT-N5">02 JLPT-N5</option>
                        <option value="03 JLPT-N4">03 JLPT-N4</option>
                    </select>
                </div>

                <div id="package-list">
                    <p style="text-align: center; color: #888;">Packages लोड हुँदैछन्...</p>
                </div>
            </div>

            <div id="section-my" class="hidden">
                <p style="text-align: center; color: #888; padding: 20px;">तपाईंसँग हाल कुनै खरिद गरिएको Package छैन।</p>
            </div>

            <div id="section-free" class="hidden">
                <p style="text-align: center; color: #888; padding: 20px;">निःशुल्क Test हरू लोड हुँदैछन्...</p>
            </div>
        </div>
    </div>

    <!-- SUPABASE INTEGRATION SCRIPT -->
    <script type="module">
        import { supabase } from './supabase.js';

        async function checkUserSession() {
            const { data: { user } } = await supabase.auth.getUser();
            
            if (user) {
                const userName = user.user_metadata?.full_name || user.email.split('@')[0];
                document.getElementById('user-display-name').innerText = userName;
                document.getElementById('auth-btn').innerHTML = '<i class="fa-solid fa-right-from-bracket" title="Logout"></i>';
                document.getElementById('auth-btn').onclick = async (e) => {
                    e.preventDefault();
                    await supabase.auth.signOut();
                    window.location.reload();
                };

                // Check Admin Status
                const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).single();
                if (profile && profile.role === 'admin') {
                    document.getElementById('admin-badge-btn').classList.remove('hidden');
                }
            }
        }

        async function fetchPackages() {
            const container = document.getElementById('package-list');
            const { data: packages, error } = await supabase.from('packages').select('*');

            if (error || !packages || packages.length === 0) {
                // Fallback Display
                container.innerHTML = `
                    <div class="pkg-card">
                        <div class="pkg-badges">
                            <span class="badge-time"><i class="fa-regular fa-clock"></i> 5 days</span>
                            <span class="badge-tests">45 mock tests</span>
                        </div>
                        <div class="pkg-title">Nursing (Japanese)<br>[5d_50t]</div>
                        <div class="pkg-footer">
                            <div>
                                <span class="old-price">350.0</span>
                                <span class="price">250</span>
                            </div>
                            <button class="btn-buy" onclick="window.location.href='paid-exam.html'">Buy Now</button>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            packages.forEach(pkg => {
                const card = document.createElement('div');
                card.className = 'pkg-card';
                card.innerHTML = `
                    <div class="pkg-badges">
                        <span class="badge-time"><i class="fa-regular fa-clock"></i> ${pkg.duration_days} days</span>
                        <span class="badge-tests">${pkg.total_tests || 45} mock tests</span>
                    </div>
                    <div class="pkg-title">${pkg.name}</div>
                    <div class="pkg-footer">
                        <div>
                            <span class="old-price">${pkg.old_price || ''}</span>
                            <span class="price">NRs ${pkg.price}</span>
                        </div>
                        <button class="btn-buy" onclick="window.location.href='paid-exam.html'">Buy Now</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('section-buy').classList.add('hidden');
            document.getElementById('section-my').classList.add('hidden');
            document.getElementById('section-free').classList.add('hidden');

            if (tab === 'buy-pkg') {
                document.getElementById('section-buy').classList.remove('hidden');
                event.target.classList.add('active');
            } else if (tab === 'my-pkg') {
                document.getElementById('section-my').classList.remove('hidden');
                event.target.classList.add('active');
            } else if (tab === 'free-tests') {
                document.getElementById('section-free').classList.remove('hidden');
                event.target.classList.add('active');
            }
        }

        checkUserSession();
        fetchPackages();
    </script>
</body>
</html>
